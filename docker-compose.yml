# 详细说明见 docs/部署-Docker.md。
#
# 用法：
#   cp config.example.toml config.toml   # 填好 [printer] 段
#   docker compose up -d
services:
  bpq:
    image: ghcr.io/owenwoow/bambu-print-queue:latest
    # 本地改过代码想自己构建，把上面这行换成：
    # build: .
    container_name: bpq
    restart: unless-stopped
    ports:
      - "8710:8710"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - bpq-data:/app/var

volumes:
  bpq-data:
