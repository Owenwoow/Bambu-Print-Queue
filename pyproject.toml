[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bpq"
version = "0.3.2"
description = "拓竹 A1 定时静默打印调度器：当场交任务，静默等待，到点自己开打"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Owenwoow" }]

dependencies = [
    "paho-mqtt>=2.0",       # 本地 MQTT（8883, TLS 自签名）
    "apscheduler>=3.10",    # date trigger + SQLAlchemyJobStore 持久化
    "setuptools<81",        # apscheduler 3.x 启动时导入 pkg_resources；
                             # setuptools 82.0（2026-02）彻底移除了它，装最新版会导致
                             # daemon 一启动就 ModuleNotFoundError，钉住版本兜底
    "sqlalchemy>=2.0",      # APScheduler 的 SQLite jobstore 依赖
    "click>=8.1",           # CLI
    "wakepy>=0.9",          # 跨平台阻止系统睡眠
    "fastapi>=0.115",       # WebUI 后端
    # 刻意不用 uvicorn[standard]：选了 SSE 就不需要 websockets，
    # 不开 reload 就不需要 watchfiles（reload 会 fork 出子进程，
    # 那会让 daemon 的单实例文件锁失效，两个进程抢打印机的唯一连接）。
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",  # 浏览器上传 3mf 必需，最容易漏
    "tomlkit>=0.12",        # 配置写回：保留 config.toml 里的注释和格式（configwrite.py 用）
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]  # httpx 供 TestClient
build = [
    "pyinstaller>=6.0",  # 打单文件二进制/exe，见 .github/workflows/release.yml
    # 下面两个只有 GUI 版 exe（traymain.py 的托盘常驻程序）用得到，
    # daemon/CLI 主依赖不需要，故不放进 dependencies。
    "pystray>=0.19",
    "Pillow>=10.0",
]

[project.scripts]
bpq = "bpq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bpq"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["bpq"]
mypy_path = "src"
ignore_missing_imports = true
