name: Release

# 推一个 vX.Y.Z 标签触发：三平台各打一个单文件可执行程序，外加一份 Docker 镜像，
# 一起挂到该标签对应的 GitHub Release 上。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # 目前只出 Windows 版，且是两个产物：
  #   - bpq-<版本>-windows-x86_64.exe      GUI 托盘版（--windowed，src/bpq/traymain.py）
  #     双击就起 daemon + WebUI，托盘常驻，不带控制台窗口，主推的懒人版形态。
  #   - bpq-cli-<版本>-windows-x86_64.exe  控制台版（src/bpq/cli.py）
  #     给愿意敲命令的人：submit / ls / daemon / status ... 完整 CLI。
  # 要恢复 Linux / macOS，把 matrix 里对应两行放回来，并把打包那步的 --add-data
  # 分隔符换成冒号（Windows 用分号，POSIX 用冒号，这是 PyInstaller 的规矩）。
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建前端（产物打进二进制里）
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装运行依赖 + pyinstaller
        run: pip install -e ".[build]"

      - name: 从 tag 取版本号
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller 打包（GUI 托盘版，懒人版，主推）
        run: >
          pyinstaller --noconfirm --onefile --windowed --name bpq
          --add-data "web/dist;web/dist"
          --add-data "config.example.toml;."
          --paths src
          --collect-submodules bpq --collect-all apscheduler --collect-all sqlalchemy
          --collect-all pystray --collect-all PIL
          src/bpq/traymain.py

      - name: 冒烟测试（GUI 托盘版：BPQ_TRAY_SELFTEST=1 验证配置读取→daemon 起→WebUI 绑定端口→优雅退出）
        # traymain.py 没有 --version 这种 CLI 解析，而且是 --windowed 无控制台窗口，
        # 没地方看输出，所以不能照搬 CLI 版那种「跑一下 --version」的冒烟测试。
        # 这一步专门沿用统一的 shell: bash 会有风险：bash 环境不一定有可靠的
        # `timeout` 命令，子进程一旦卡住（比如误入真正的 pystray.Icon.run() 消息泵）
        # 就可能一路卡到 job 整体超时，所以改用 PowerShell 原生的
        # Start-Process -PassThru + Wait-Process -Timeout 自己控制超时和收尾。
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 在一个干净的临时目录里跑：exe 旁边会自动生成 config.toml（占位打印机
          # IP，连不上是预期的，不影响这里要验证的东西），不要污染 checkout 目录。
          $work = Join-Path $env:RUNNER_TEMP "bpq-tray-selftest"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "dist/bpq.exe" (Join-Path $work "bpq.exe") -Force
          $outFile = Join-Path $work "selftest_result.txt"
          $logFile = Join-Path $work "var\bpq.log"

          # 失败时把 var/bpq.log 原样吐到 Actions 日志里——这个 exe 没有控制台，
          # 失败原因全在这个文件里，不转存出来就只能靠猜。
          function Dump-Log {
            if (Test-Path $logFile) {
              Write-Host "----- var/bpq.log -----"
              Get-Content $logFile | Write-Host
              Write-Host "----- end of var/bpq.log -----"
            } else {
              Write-Host "##[warning] $logFile 不存在，daemon 大概率没跑到 _setup_logging() 之后"
            }
          }

          $env:BPQ_TRAY_SELFTEST = "1"
          $env:BPQ_TRAY_SELFTEST_OUT = $outFile

          $proc = Start-Process -FilePath (Join-Path $work "bpq.exe") -WorkingDirectory $work -PassThru
          Wait-Process -Id $proc.Id -Timeout 60 -ErrorAction SilentlyContinue

          if (-not $proc.HasExited) {
            Write-Host "##[error] GUI 托盘版 selftest 60 秒内未退出，判定超时失败，强杀进程"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Dump-Log
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Host "##[error] GUI 托盘版 selftest 退出码非 0：$($proc.ExitCode)"
            Dump-Log
            exit 1
          }
          if (-not (Test-Path $outFile)) {
            Write-Host "##[error] GUI 托盘版 selftest 未生成结果文件：$outFile"
            Dump-Log
            exit 1
          }
          $content = Get-Content $outFile -Raw
          if ($content -notmatch "OK") {
            Write-Host "##[error] GUI 托盘版 selftest 结果文件内容异常：$content"
            Dump-Log
            exit 1
          }
          Write-Host "GUI 托盘版 selftest 通过：$outFile -> $content"

      - name: 改名成带版本号和平台标识的产物（GUI 托盘版）
        shell: bash
        run: mv dist/bpq.exe "bpq-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bpq-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          path: bpq-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          if-no-files-found: error

      - name: PyInstaller 打包（控制台版：submit / ls / daemon / status ...）
        run: >
          pyinstaller --noconfirm --onefile --name bpq-cli
          --add-data "web/dist;web/dist"
          --add-data "config.example.toml;."
          --paths src
          --collect-submodules bpq --collect-all apscheduler --collect-all sqlalchemy
          src/bpq/cli.py

      - name: 冒烟测试（控制台版：--version 起得来）
        shell: bash
        run: ./dist/bpq-cli.exe --version

      - name: 改名成带版本号和平台标识的产物（控制台版）
        shell: bash
        run: mv dist/bpq-cli.exe "bpq-cli-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bpq-cli-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          path: bpq-cli-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # 硬编码小写名字：Docker 镜像名不允许大写，而仓库名 Bambu-Print-Queue 有大写，
          # 直接用 ${{ github.repository }} 会拼出不合法的 tag。
          images: ghcr.io/owenwoow/bambu-print-queue
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [build-binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bpq-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
