name: Release

# 推一个 vX.Y.Z 标签触发：三平台各打一个单文件可执行程序，外加一份 Docker 镜像，
# 一起挂到该标签对应的 GitHub Release 上。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  # 目前只出 Windows 版（懒人版：双击就起 daemon + WebUI）。
  # 要恢复 Linux / macOS，把 matrix 里对应两行放回来，并把打包那步的 --add-data
  # 分隔符换成冒号（Windows 用分号，POSIX 用冒号，这是 PyInstaller 的规矩）。
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建前端（产物打进二进制里）
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装运行依赖 + pyinstaller
        run: pip install -e ".[build]"

      - name: 从 tag 取版本号
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: PyInstaller 打包
        run: >
          pyinstaller --noconfirm --onefile --name bpq
          --add-data "web/dist;web/dist"
          --add-data "config.example.toml;."
          --paths src
          --collect-submodules bpq --collect-all apscheduler --collect-all sqlalchemy
          src/bpq/cli.py

      - name: 冒烟测试（--version 起得来）
        shell: bash
        run: ./dist/bpq.exe --version

      - name: 改名成带版本号和平台标识的产物
        shell: bash
        run: mv dist/bpq.exe "bpq-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bpq-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          path: bpq-${{ steps.ver.outputs.version }}-${{ matrix.suffix }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # 硬编码小写名字：Docker 镜像名不允许大写，而仓库名 Bambu-Print-Queue 有大写，
          # 直接用 ${{ github.repository }} 会拼出不合法的 tag。
          images: ghcr.io/owenwoow/bambu-print-queue
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [build-binaries, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bpq-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
